<header><b>🏫 SWAT ISLAMIA EDUCATIONAL COMPLEX</b><span>Smart Paper Builder · Saidu Sharif, Swat</span></header>
<nav><button id="n1" onclick="tab('b')">🧩 Builder</button><button id="n2" onclick="tab('q')">⭐ Question Bank</button><button id="n3" onclick="tab('s')">📂 Saved Papers</button></nav>

<script>
const $=s=>document.querySelector(s),E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLASSES=['Playgroup','Nursery','Prep','1st Class','2nd Class','3rd Class','4th Class','5th Class','6th Class','7th Class','8th Class','9th Class','10th Class'];
const SUBJ=['English','Urdu','Mathematics','Science','Computer','Islamiat','Social Studies','Pashto','Physics','Chemistry','Biology'];
const TYPES={mcq:{n:'MCQs',l:'Multiple Choice Questions',i:'Choose the correct option.',e:1,sp:'None'},short:{n:'Short Questions',l:'Short Questions',i:'Answer the following short questions.',e:2,sp:'None'},long:{n:'Long Questions',l:'Long Questions',i:'Answer the following questions in detail.',e:5,sp:'None'},blank:{n:'Fill in the Blanks',l:'Fill in the Blanks',i:'Fill in the blanks with suitable words.',e:1,sp:'None'},tf:{n:'True / False',l:'True or False',i:'Write True or False against each statement.',e:1,sp:'None'}};
const mem={},store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),deep=o=>JSON.parse(JSON.stringify(o));
const item=t=>({q:'',o:['','','',''],a:''}),LET='ABCDEFGH';
function sec(type,idx){const T=TYPES[type];return{type,title:`Section ${LET[idx]||''} – ${T.l}`,instr:T.i,each:T.e,attempt:'',space:T.sp,items:[item()]}}
function newPaper(){return{id:uid(),name:'',cls:'',subject:'',date:'',time:'',marks:'',set:'none',created:Date.now(),sections:[sec('mcq',0),sec('short',1),sec('long',2)],st:{school:'SWAT ISLAMIA EDUCATIONAL COMPLEX',address:'Saidu Sharif, Swat',fs:12,gap:1,margin:2,hdr:true,pg:true,cols:'auto'}}}
let P=newPaper(),papers=store.get('pm_papers',[]),bank=store.get('pm_bank',[]),view='b',mode='paper',bf={cls:'',subject:'',type:'',q:''};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const fd=d=>d?d.split('-').reverse().join('/'):'';
function tab(v){view=v;['b','q','s'].forEach((x,i)=>$('#n'+(i+1)).className=x===v?'on':'');({b:rB,q:rQ,s:rS})[v]();window.scrollTo(0,0)}
/* ---------- paper sets (shuffle) + checks ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},
 shuf=(arr,r)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}};
function setView(){if(!['B','C','D'].includes(P.set))return P;const c=deep(P),r=rng(P.set.charCodeAt(0)*7919+13);
 c.sections.forEach(s=>{shuf(s.items,r);if(s.type==='mcq')s.items.forEach(x=>{const o=[0,1,2,3];shuf(o,r);const k=x.a?'ABCD'.indexOf(x.a):-1;x.o=o.map(i=>x.o[i]);x.a=k>=0?'ABCD'[o.indexOf(k)]:''})});return c}
const using=fn=>{const o=P;P=setView();try{return fn()}finally{P=o}},setL=()=>P.set&&P.set!=='none'?' — Set '+P.set:'';
function sumH(){const m=model(),w=[];P.sections.forEach(s=>{const it=s.items.filter(x=>x.q.trim());
 if(s.type==='mcq'){const na=it.filter(x=>!x.a).length,eo=it.filter(x=>x.o.some(o=>!o.trim())).length;if(na)w.push(`${na} MCQ(s) in “${s.title}” have no correct answer`);if(eo)w.push(`${eo} MCQ(s) in “${s.title}” have an empty option`)}
 else if(s.type==='tf'||s.type==='blank'){const na=it.filter(x=>!x.a.trim()).length;if(na)w.push(`${na} question(s) in “${s.title}” have no answer for the key`)}
 if(+s.attempt>it.length&&it.length)w.push(`“${s.title}”: “Attempt any ${s.attempt}” is more than the ${it.length} questions added`)});
 if(!P.cls)w.push('Class is not selected');if(!P.subject.trim())w.push('Subject is empty');
 const q=m.bl.filter(b=>b.k==='q').length;
 return`<b>📊 ${q} questions · ${m.tot} total marks</b><div style="color:var(--mut);font-size:13px;margin:3px 0">${m.bl.filter(b=>b.k==='s').map(b=>E(b.t.replace(/ – .*/,''))+': '+E(b.m||'—')).join(' &nbsp;|&nbsp; ')||'Add questions to see the marks breakdown'}</div>${w.length?`<div class="warn">⚠️ ${w.map(E).join('<br>⚠️ ')}</div>`:'<div style="color:#4ade80;font-size:13px">✔ Paper looks complete</div>'}`}
/* ---------- model shared by preview + Word ---------- */
function model(){let tot=0,bl=[],key=[];
 P.sections.forEach(s=>{const it=s.items.filter(x=>x.q.trim());if(!it.length)return;const cnt=Math.min(+s.attempt||it.length,it.length),mk=cnt*(+s.each||0);tot+=mk;
  bl.push({k:'s',t:s.title,i:s.instr+(+s.attempt&&+s.attempt<it.length?` Attempt any ${s.attempt} questions.`:''),m:(+s.each?`${cnt} × ${s.each} = ${mk}`:'')});
  const ks=[];it.forEach((x,n)=>{bl.push({k:'q',n:n+1,x,t:s.type,sp:s.space});if(['mcq','tf','blank'].includes(s.type))ks.push({n:n+1,a:x.a})});if(ks.length)key.push({t:s.title,ks})});
 return{tot:P.marks.trim()||String(tot),bl,key}}
const cols=x=>P.st.cols==='1 column'?1:P.st.cols==='2 columns'?2:(x.o.every(o=>o.length<=24)?2:1),SPN={None:0,Small:2,Medium:4,Large:8};
function sheet(isKey){const m=model(),s=P.st;let h=(s.hdr?`<div class="sc">${E(s.school)}</div><div class="ad">${E(s.address)}</div>`:'')+`${isKey?`<div class="pn">ANSWER KEY${E(setL())}</div>`:'<div style="height:6px"></div>'}
 <table class="in"><tr><td><b>Class:</b> ${E(P.cls)}${P.set&&P.set!=='none'?' &nbsp;&nbsp;&nbsp; <b>Set:</b> '+P.set:''}</td><td><b>Subject:</b> ${E(P.subject)}</td></tr><tr><td><b>Time:</b> ${E(P.time)}</td><td><b>Total Marks:</b> ${E(m.tot)}</td></tr>${isKey?'':'<tr><td><b>Student Name:</b> ____________________</td><td><b>Roll No:</b> __________</td></tr>'}</table>`;
 if(isKey)return h+m.key.map(g=>`<div class="sh"><span>${E(g.t)}</span></div><div class="ky">${g.ks.map(k=>`<div><b>${k.n}.</b> ${E(k.a)||'—'}</div>`).join('')}</div>`).join('');
 m.bl.forEach(b=>{if(b.k==='s'){h+=`<div class="sh"><span>${E(b.t)}</span><span>${E(b.m)}</span></div><div class="si">${E(b.i)}</div>`;return}
  const x=b.x;h+=`<div class="q" style="margin-bottom:${s.gap*s.fs}pt"><b>${b.n}.</b><div><div dir="auto" style="white-space:pre-wrap">${E(x.q)}${b.t==='tf'?' &nbsp; (True / False)':''}</div>`;
  if(b.t==='mcq')h+=`<div class="o" style="grid-template-columns:repeat(${cols(x)},1fr)">${[0,1,2,3].map(j=>`<div dir="auto">${'ABCD'[j]}. ${E(x.o[j])}</div>`).join('')}</div>`;
  else if(['short','long'].includes(b.t))h+='<div class="ln"></div>'.repeat(SPN[b.sp]||0);h+='</div></div>'});
 return h}
let pt;function pv(){clearTimeout(pt);pt=setTimeout(()=>{const e=$('#sheet');if(e){e.innerHTML=using(()=>sheet(mode==='key'));const sm=$('#sum');if(sm)sm.innerHTML=sumH();e.style.fontSize=P.st.fs+'pt';e.style.padding=P.st.margin+'cm'}},120)}
/* ---------- builder ---------- */
const SET=(k,v)=>{P[k]=v;pv()},ST=(k,v)=>{P.st[k]=v;pv()},IT=(a,b)=>P.sections[a].items[b];
function rB(){const o=(a,v)=>a.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join(''),st=P.st;
 $('#main').innerHTML=`<div class="bar"><button class="btn" onclick="P=newPaper();mode='paper';rB()">📄 New Paper</button><button class="btn p" onclick="savePaper()">💾 Save Paper</button>
 <button class="btn" onclick="exp(false)">📘 Export to MS Word</button><button class="btn" onclick="doPrint()">🖨 Print</button>
 <button class="btn" onclick="mode=mode==='key'?'paper':'key';pv();$('#kb').textContent=mode==='key'?'📄 Show Paper':'🔑 Show Answer Key'" id="kb">🔑 Show Answer Key</button><button class="btn" onclick="exp(true)">📘 Answer Key (.docx)</button>
 <label style="display:flex;gap:5px;align-items:center;margin:0;font-weight:600"><input type="checkbox" id="inck" style="width:auto"> Include key page in Word file</label></div>
 <div class="split"><div><div class="card"><div class="grid">
 <div><label>Class</label><select onchange="SET('cls',this.value)"><option value="">Select…</option>${o(CLASSES,P.cls)}</select></div>
 <div><label>Subject</label><input list="sl" value="${E(P.subject)}" oninput="SET('subject',this.value)"><datalist id="sl">${SUBJ.map(s=>`<option>${s}`).join('')}</datalist></div>
 <div style="grid-column:span 2"><label>Paper Name (for saving only – not printed)</label><input value="${E(P.name)}" placeholder="e.g. Science Mid Term Examination" oninput="SET('name',this.value)"></div>
  <div><label>Time</label><input value="${E(P.time)}" placeholder="e.g. 2 Hours" oninput="SET('time',this.value)"></div>
 <div><label>Total Marks (blank = auto)</label><input value="${E(P.marks)}" placeholder="auto" oninput="SET('marks',this.value)"></div>
 <div><label>Paper Set</label><select onchange="SET('set',this.value)">${[['none','Single set'],['A','Set A (original order)'],['B','Set B (shuffled)'],['C','Set C (shuffled)'],['D','Set D (shuffled)']].map(x=>`<option value="${x[0]}" ${(P.set||'none')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div></div>
 <details><summary style="cursor:pointer;font-weight:600">Paper Settings</summary><div class="grid" style="margin-top:10px">
 <div><label>School name</label><input value="${E(st.school)}" oninput="ST('school',this.value)"></div><div><label>Address</label><input value="${E(st.address)}" oninput="ST('address',this.value)"></div>
 <div><label>Font size (pt)</label><input type="number" min="8" max="20" value="${st.fs}" oninput="ST('fs',+this.value||12)"></div><div><label>Gap between questions (lines)</label><input type="number" min="0" max="3" step="0.25" value="${st.gap}" oninput="ST('gap',+this.value||0)"></div>
 <div><label>Margins (cm)</label><input type="number" min="1" max="4" step="0.5" value="${st.margin}" oninput="ST('margin',+this.value||2)"></div>
 <div><label>School header</label><select onchange="ST('hdr',this.value==='Show')"><option ${st.hdr?'selected':''}>Show</option><option ${!st.hdr?'selected':''}>Hide</option></select></div>
 <div><label>Page numbers</label><select onchange="ST('pg',this.value==='Show')"><option ${st.pg?'selected':''}>Show</option><option ${!st.pg?'selected':''}>Hide</option></select></div>
 <div><label>MCQ options</label><select onchange="ST('cols',this.value)">${o(['auto','1 column','2 columns'],st.cols)}</select></div></div></details></div>
 <div class="card" id="sum"></div><div id="secs">${P.sections.map(secH).join('')}</div>
 <div class="card"><label>Add a new section</label><div class="bar" style="margin:0">${Object.keys(TYPES).map(t=>`<button class="btn s" onclick="addS('${t}')">➕ ${TYPES[t].n}</button>`).join('')}</div></div></div>
 <div class="pvw"><div class="sheet" id="sheet"></div></div></div>`;mode='paper';pv();setTimeout(()=>{const e=$('#sheet');e.innerHTML=using(()=>sheet(false));e.style.fontSize=st.fs+'pt';e.style.padding=st.margin+'cm'},0)}
function secH(s,si){const n=P.sections.length,sp=['short','long'].includes(s.type);
 return`<div class="card"><div class="qh"><span class="tag">${TYPES[s.type].n}</span><span><button class="btn s" ${si?'':'disabled'} onclick="mvS(${si},-1)">⬆</button> <button class="btn s" ${si<n-1?'':'disabled'} onclick="mvS(${si},1)">⬇</button> <button class="btn s d" onclick="delS(${si})">🗑 Delete Section</button></span></div>
 <div class="grid"><div style="grid-column:1/-1"><label>Section heading</label><input value="${E(s.title)}" oninput="P.sections[${si}].title=this.value;pv()"></div>
 <div style="grid-column:1/-1"><label>Instruction</label><input value="${E(s.instr)}" oninput="P.sections[${si}].instr=this.value;pv()"></div>
 <div><label>Marks each</label><input type="number" min="0" step="0.5" value="${s.each}" oninput="P.sections[${si}].each=this.value;pv()"></div>
 <div><label>Attempt any (optional)</label><input type="number" min="0" value="${E(s.attempt)}" oninput="P.sections[${si}].attempt=this.value;pv()"></div>
 ${sp?`<div><label>Blank answer space</label><select onchange="P.sections[${si}].space=this.value;pv()">${['None','Small','Medium','Large'].map(v=>`<option ${s.space===v?'selected':''}>${v}</option>`).join('')}</select></div>`:''}</div>
 ${s.items.map((x,i)=>itH(s,si,x,i)).join('')}<div class="bar" style="margin:10px 0 0"><button class="btn s p" onclick="addI(${si})">➕ Add Question</button></div>
 <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">📥 Bulk paste questions</summary><div style="margin-top:6px"><textarea id="bp${si}" rows="6" dir="auto" placeholder="${s.type==='mcq'?'1. What is the brain of the computer?&#10;A. Monitor&#10;B. CPU&#10;C. Keyboard&#10;D. Mouse&#10;Answer: B&#10;&#10;2. Next question…':'One question per line (numbers are removed automatically)'}"></textarea><button class="btn s p" style="margin-top:6px" onclick="bulk(${si})">Add pasted questions</button></div></details></div>`}
function itH(s,si,x,i){const L=s.items.length,t=s.type;

function parseBulk(t,txt){const L=txt.split('\n').map(s=>s.trim()).filter(Boolean),out=[];

  if(m=l.match(/^(?:ans(?:wer)?|correct(?: answer)?)\s*[:\-]?\s*\(?([A-Da-d])/i)){if(c)c.a=m[1].toUpperCase();return}
  if(m=l.match(/^\(?([A-Da-d])[\.\)\:]\s*(.*)/)){if(!c)c=item();c.o['ABCD'.indexOf(m[1].toUpperCase())]=m[2];return}
